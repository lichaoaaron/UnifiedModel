kind: external_storage
schema:
  url: "mmodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "otel.local_snapshot"
  domain: otel
  display_name:
    en_us: "Local OTel Telemetry Snapshot"
    zh_cn: "本地 OTel 遥测快照"
  description:
    en_us: >
      Local file-based OpenSearch export snapshot for OTel Demo telemetry.
      Metric, Log, and Trace files are stored in data/metric, data/log, and data/trace.
    zh_cn: >
      基于本地文件的 OpenSearch 导出快照，用于 OTel Demo 遥测数据。
      指标、日志、链路数据分别存储在 data/metric、data/log、data/trace 目录。
spec:
  type: local_file
  name: otel.local_snapshot
  properties:
    metric_dir: "metric"
    log_dir: "log"
    trace_dir: "trace"
    time_field_metric: "time"
    time_field_log: "observedTimestamp"
    time_field_trace: "startTime"

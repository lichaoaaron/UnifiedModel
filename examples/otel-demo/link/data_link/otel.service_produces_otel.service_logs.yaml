kind: data_link
schema:
  url: "mmodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "otel.service_produces_otel.service_logs"
  domain: otel
  display_name:
    en_us: "Service Produces Logs"
    zh_cn: "服务产生日志"
  description:
    en_us: "Links an OTel Demo service entity to its log set via serviceName."
    zh_cn: "通过 serviceName 将 OTel Demo 服务实体关联到其日志集。"
spec:
  src:
    domain: otel
    kind: entity_set
    name: otel.service
  dest:
    domain: otel
    kind: log_set
    name: otel.service_logs
  data_link_type: produce
  fields_mapping:
    display_name: serviceName

kind: data_link
schema:
  url: "mmodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "platform.service_produces_platform.service_logs"
  domain: platform
  display_name:
    en_us: "Service Produces Logs"
    zh_cn: "服务产生日志"
  description:
    en_us: "Links a platform service entity to its log set via serviceName."
    zh_cn: "通过 serviceName 将平台服务实体关联到其日志集。"
spec:
  src:
    domain: platform
    kind: entity_set
    name: platform.service
  dest:
    domain: platform
    kind: log_set
    name: platform.service_logs
  data_link_type: produce
  fields_mapping:
    display_name: serviceName

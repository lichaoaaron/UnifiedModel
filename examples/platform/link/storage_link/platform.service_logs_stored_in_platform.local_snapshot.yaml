kind: storage_link
schema:
  url: "mmodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "platform.service_logs_stored_in_platform.local_snapshot"
  domain: platform
  display_name:
    en_us: "Service Logs in Local Snapshot"
    zh_cn: "平台服务日志存储在本地快照"
  description:
    en_us: "Links platform service logs to the local file snapshot storage."
    zh_cn: "将平台服务日志关联到本地文件快照存储。"
spec:
  src:
    domain: platform
    kind: log_set
    name: platform.service_logs
  dest:
    domain: platform
    kind: external_storage
    name: platform.local_snapshot
  fields_mapping:
    serviceName: serviceName
    time: time

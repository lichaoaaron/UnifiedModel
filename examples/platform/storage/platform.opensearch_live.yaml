kind: external_storage
schema:
  url: "mmodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "platform.opensearch_live"
  domain: platform
  display_name:
    en_us: "OpenSearch Live Telemetry"
    zh_cn: "OpenSearch 在线遥测"
  description:
    en_us: >
      OpenSearch-backed telemetry storage for platform.service evidence lookback.
      Replace placeholder credentials and endpoint in development configuration.
    zh_cn: >
      基于 OpenSearch 的 platform.service 实体回查遥测存储。
      请在开发配置中替换示例 endpoint 与凭据占位值。
spec:
  type: opensearch
  name: platform.opensearch_live
  properties:
    endpoint: "http://localhost:13121"
    username: "admin"
    password: "MorenMima@123456"
    log_index: "otel-logs-*"
    metric_index: "otel-metrics-*"
    trace_index: "otel-v1-apm-span-*"
    time_field_log: "time"
    time_field_metric: "time"
    time_field_trace: "startTime"
    service_name_field_log: "serviceName"
    service_name_field_metric: "serviceName"
    service_name_field_trace: "serviceName"
    verify_tls: "false"
    request_timeout_ms: "10000"

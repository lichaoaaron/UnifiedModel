kind: log_set
schema:
  url: "mmodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "platform.service_logs"
  domain: platform
  display_name:
    en_us: "Platform Service Logs"
    zh_cn: "平台服务日志"
  description:
    en_us: "OpenTelemetry logs emitted by a platform service."
    zh_cn: "平台服务通过 OpenTelemetry 上报的日志数据。"
spec:
  fields:
    - name: serviceName
      type: string
      display_name:
        en_us: "Service Name"
        zh_cn: "服务名称"
    - name: time
      type: string
      display_name:
        en_us: "Time"
        zh_cn: "时间"
    - name: severityText
      type: string
      display_name:
        en_us: "Severity"
        zh_cn: "日志级别"
    - name: body
      type: string
      display_name:
        en_us: "Body"
        zh_cn: "日志内容"

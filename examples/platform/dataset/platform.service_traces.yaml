kind: trace_set
schema:
  url: "mmodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "platform.service_traces"
  domain: platform
  display_name:
    en_us: "Platform Service Traces"
    zh_cn: "平台服务链路追踪"
  description:
    en_us: "OpenTelemetry spans emitted by a platform service."
    zh_cn: "平台服务通过 OpenTelemetry 上报的链路数据。"
spec:
  trace_id_field: traceId
  span_id_field: spanId
  parent_span_id_field: parentSpanId
  protocol: opentelemetry
